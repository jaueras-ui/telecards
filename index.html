<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleCards - Coleção de Cartões Telefônicos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2e;
            --accent-pink: #ff0055;
            --accent-green: #25d366;
            --text-color: #ffffff;
            --text-muted: #a0a5b5;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Botão Flutuante Customizado com a sua foto e Fundo Verde na Seta */
        .btn-avatar-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid var(--accent-pink);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 0, 85, 0.6);
            cursor: pointer;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 99999;
            padding: 0;
            outline: none;
        }

        .btn-avatar-top:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 0, 85, 0.9);
        }

        .btn-avatar-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        /* Seta indicativa sobreposta no avatar com fundo verde */
        .btn-avatar-top .arrow-overlay {
            position: absolute;
            bottom: 0px;
            right: 0px;
            background: var(--accent-green);
            color: #ffffff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: 2px solid var(--bg-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <!-- Container do seu catálogo original -->
    <div class="container" id="catalogo-container">
    </div>

    <!-- Botão de Voltar ao Topo com a sua foto exata -->
    <button class="btn-avatar-top" onclick="scrollToTop()" title="Voltar ao topo">
        <img src="minha_foto.jpg" alt="Voltar ao topo">
        <div class="arrow-overlay">
            <i class="fa-solid fa-arrow-up"></i>
        </div>
    </button>

    <script>
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
