<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleCards - Coleção de Cartões Telefônicos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos Base e Tema Escuro */
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2e;
            --accent-pink: #ff0055;
            --text-color: #ffffff;
            --text-muted: #a0a5b5;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo do Card do Item */
        .card-item {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .code-header {
            color: #00e5ff;
            font-family: monospace;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .series-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-name {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card-price {
            color: var(--accent-pink);
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* Botão Adicionar ao Álbum */
        .action-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-add {
            width: 100%;
            background-color: var(--accent-pink);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #e0004c;
            transform: translateY(-2px);
        }

        /* Botão Flutuante Customizado com a Foto (Ajustado sem cortes) */
        .btn-avatar-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid var(--accent-pink);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 0, 85, 0.6);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 9999;
            padding: 0;
        }

        .btn-avatar-top:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 0, 85, 0.9);
        }

        .btn-avatar-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Seta indicativa sobreposta no avatar */
        .btn-avatar-top .arrow-overlay {
            position: absolute;
            bottom: 0px;
            right: 0px;
            background: var(--accent-pink);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: 2px solid var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="container" id="catalogo-container">
        <!-- O conteúdo dos cartões da sua base de dados será injetado aqui pelo script original -->
    </div>

    <!-- Botão de Voltar ao Topo com Avatar Personalizado -->
    <button class="btn-avatar-top" onclick="scrollToTop()" title="Voltar ao topo">
        <img src="avatar.png" alt="Voltar ao topo">
        <div class="arrow-overlay">
            <i class="fa-solid fa-arrow-up"></i>
        </div>
    </button>

    <script>
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
    
    <!-- Seu script de carregamento de dados (ajuste o nome do arquivo js se necessário, ex: app.js ou script.js) -->
    <script src="script.js"></script>
</body>
</html>
