<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleCards - Acervo e Coleção</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { dark: '#0a0a0f', card: '#13131a', border: '#22223b' },
            vinculador: { DEFAULT: '#10b981', hover: '#059669' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a0f; color: #f1f5f9; font-family: 'Inter', sans-serif; }
    .card-stack-visitor { transform: rotate(4deg); }
    .card-stack-admin { transform: rotate(-6deg); }
  </style>

  <!-- Sub-arquivos JS de cada Operadora -->
  <script src="brasiltelecom.js" onerror="console.log('brasiltelecom.js não encontrado')"></script>
  <script src="telefonica.js" onerror="console.log('telefonica.js não encontrado')"></script>
  <script src="telebras.js" onerror="console.log('telebras.js não encontrado')"></script>
  <script src="embratel.js" onerror="console.log('embratel.js não encontrado')"></script>
  <script src="crt.js" onerror="console.log('crt.js não encontrado')"></script>
  <script src="oi.js" onerror="console.log('oi.js não encontrado')"></script>
  <script src="telemar.js" onerror="console.log('telemar.js não encontrado')"></script>
  <script src="ceterp.js" onerror="console.log('ceterp.js não encontrado')"></script>
  <script src="cbtc.js" onerror="console.log('cbtc.js não encontrado')"></script>
  <script src="telepar.js" onerror="console.log('telepar.js não encontrado')"></script>
  <script src="telesc.js" onerror="console.log('telesc.js não encontrado')"></script>
  <script src="telemig.js" onerror="console.log('telemig.js não encontrado')"></script>
  <script src="telegoias.js" onerror="console.log('telegoias.js não encontrado')"></script>
  <script src="telerj.js" onerror="console.log('telerj.js não encontrado')"></script>
  <script src="sercomtel.js" onerror="console.log('sercomtel.js não encontrado')"></script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur-md border-b border-brand-border">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
          <i class="fa-solid fa-id-card text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            TeleCards <span class="text-xs px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20">Acervo Oficial</span>
          </h1>
          <p class="text-xs text-slate-400">Catálogo e Gestão de Telefonia</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <!-- Botão Vinculador com nova cor verde -->
        <button id="btn-vinculador" class="bg-vinculador hover:bg-vinculador-hover text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-500/20 flex items-center gap-2">
          <i class="fa-solid fa-link"></i> Vinculador Rápido
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <section class="text-center py-12 mb-8 bg-gradient-to-b from-purple-900/10 to-transparent rounded-3xl border border-brand-border p-8">
      <h2 class="text-4xl font-extrabold tracking-tight text-white mb-4">Preservando <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400">memórias.</span></h2>
      <p class="text-slate-400 max-w-2xl mx-auto text-base">Séries completas de artes, cartões avulsos, orelhões históricos e a magia retrô da telecartofilia em um único acervo.</p>
    </section>
  </main>

  <footer class="border-t border-brand-border py-6 text-center text-xs text-slate-500">
    #Paz.e.Bem - TeleCards Acervo & Coleção
  </footer>

</body>
</html>
