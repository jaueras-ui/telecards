<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleCards - Acervo de Cartões Telefônicos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="main-header">
    <div class="logo-container">
      <img src="logo.png" alt="TeleCards Logo" class="logo-img" onerror="this.style.display='none'">
      <h1 class="logo-title">TeleCards</h1>
    </div>
    <div class="mode-toggle">
      <button id="btn-visitor" class="mode-btn">Modo Visitante</button>
      <button id="btn-bastidores" class="mode-btn active">Modo Bastidores</button>
    </div>
  </header>

  <main class="container">

    <!-- HISTÓRICO DE VENDIDOS -->
    <section class="section-box">
      <div class="section-header">
        <h2>HISTÓRICO DE CARTÕES VENDIDOS</h2>
        <span class="badge-count">0 vendidos</span>
      </div>
      <div class="empty-state">
        <p>Nenhum cartão vendido.</p>
      </div>
    </section>

    <!-- FILTRAR POR OPERADORA -->
    <section class="filter-section">
      <h3>FILTRAR POR OPERADORA</h3>
      <div class="filter-buttons-operator">
        <button class="filter-btn active" data-operator="Todos">Todos</button>
        <button class="filter-btn" data-operator="Telefônica">Telefônica</button>
        <button class="filter-btn" data-operator="Telebrás">Telebrás</button>
        <button class="filter-btn" data-operator="Brasil Telecom">Brasil Telecom</button>
        <button class="filter-btn" data-operator="CRT">CRT</button>
        <button class="filter-btn" data-operator="Oi">Oi</button>
        <button class="filter-btn" data-operator="Telemar">Telemar</button>
        <button class="filter-btn" data-operator="Ceterp">Ceterp</button>
        <button class="filter-btn" data-operator="CTBC">CTBC</button>
        <button class="filter-btn" data-operator="Telepar">Telepar</button>
        <button class="filter-btn" data-operator="Telesc">Telesc</button>
        <button class="filter-btn" data-operator="Telemig">Telemig</button>
        <button class="filter-btn" data-operator="Telegoias">Telegoias</button>
        <button class="filter-btn" data-operator="Telerj">Telerj</button>
        <button class="filter-btn" data-operator="Sercomtel">Sercomtel</button>
      </div>
    </section>

    <!-- FILTRAR POR TIPO -->
    <section class="filter-section">
      <div class="filter-inline">
        <h3>FILTRAR POR TIPO:</h3>
        <div class="filter-buttons-type">
          <button class="filter-btn type-btn active" data-type="Todos">Todos</button>
          <button class="filter-btn type-btn" data-type="Séries Completas">Séries Completas</button>
          <button class="filter-btn type-btn" data-type="Lotes">Lotes</button>
          <button class="filter-btn type-btn" data-type="Avulsos">Avulsos</button>
          <button class="filter-btn type-btn" data-type="Sem Foto">Sem Foto</button>
        </div>
      </div>
    </section>

    <!-- GRID DE CARTÕES -->
    <section class="cards-grid" id="cards-container">
      <!-- Os cartões serão renderizados dinamicamente pelo JavaScript -->
    </section>

  </main>

  <!-- CARREGAMENTO DOS SCRIPTS -->
  <script src="cbtc.js"></script>
  <script src="script.js"></script>
</body>
</html>
