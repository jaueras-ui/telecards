<script>
    const DEFAULT_OPS = ["Telefônica", "Telebrás", "Brasil Telecom", "Embratel", "CRT", "Oi", "Telemar", "Ceterp", "CBTC", "Telepar", "Telesc", "Telemig", "Telegoias", "Telerj", "Sercomtel", "Claro", "TIM", "Outras"];
    let externalCards = [];
    let queueFiles = []; 
    let currentImageIndex = 0; 

    function handleAvatarError(img) {
      if (!img.dataset.step) {
        img.dataset.step = "1";
        img.src = "minha_foto.jpeg";
      } else if (img.dataset.step === "1") {
        img.dataset.step = "2";
        img.src = "minha_foto.png";
      } else if (img.dataset.step === "2") {
        img.dataset.step = "3";
        img.src = "logo.jpg";
      } else {
        img.onerror = null;
      }
    }

    function handleLogoError(img) {
      if (!img.dataset.step) {
        img.dataset.step = "1";
        img.src = "logo.jpeg";
      } else if (img.dataset.step === "1") {
        img.dataset.step = "2";
        img.src = "logo.png";
      } else {
        img.onerror = null;
      }
    }

    function classifyCardType(title) {
      const t = (title || "").toLowerCase();
      if (t.includes('completa') || t.includes('série -') || t.includes('card nº todos!')) return 'Completa';
      if (t.includes('lote') || t.includes('cards') || t.includes('incompl')) return 'Lote';
      return 'Avulso';
    }

    function formatarCaminhoImagem(caminho, operator, ref) {
      if (caminho && caminho.startsWith('data:image')) return caminho;

      let limpo = (caminho || '').trim().replace(/\\/g, '/');
      if (limpo.startsWith('http://') || limpo.startsWith('https://')) return limpo;

      const op = (operator || '').toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      let opPasta = 'telefonica';
      if (op.includes('brasil telecom')) opPasta = 'brasil_telecom';
      else if (op.includes('telebras')) opPasta = 'telebras';
      else if (op.includes('telemar')) opPasta = 'telemar';
      else if (op.includes('embratel')) opPasta = 'embratel';
      else if (op.includes('crt')) opPasta = 'crt';
      else if (op.includes('oi')) opPasta = 'oi';
      else if (op.includes('ceterp')) opPasta = 'ceterp';
      else if (op.includes('cbtc')) opPasta = 'cbtc';
      else if (op.includes('telepar')) opPasta = 'telepar';
      else if (op.includes('telesc')) opPasta = 'telesc';
      else if (op.includes('telemig')) opPasta = 'telemig';
      else if (op.includes('telegoias')) opPasta = 'telegoias';
      else if (op.includes('telerj')) opPasta = 'telerj';
      else if (op.includes('sercomtel')) opPasta = 'sercomtel';

      if (!limpo || limpo.includes('placeholder.com')) {
        return ''; // Retorna vazio se não houver caminho válido
      }

      if (limpo.startsWith('fotos/')) return limpo;
      let partes = limpo.split('/');
      let nomeArq = partes[partes.length - 1];
      if (!nomeArq) return '';
      return `fotos/${opPasta}/${nomeArq}`;
    }

    function parseExternal(rawData, defaultOp) {
      if (!rawData) return;
      let items = rawData;
      if (!Array.isArray(items)) {
        const k = Object.keys(items).find(key => Array.isArray(items[key]));
        if (k) items = items[k];
      }
      if (Array.isArray(items)) {
        items.forEach(item => {
          const title = item.title || item.name || 'Cartão Telefônico';
          const op = item.operator || defaultOp;
          const cardId = item.id || 'ext-' + Math.random();
          
          let rawPrice = parseFloat(item.price);
          const price = (!isNaN(rawPrice) && rawPrice > 0) ? rawPrice : 2.00;
          const ref = item.ref || item.code || item.serie || cardId;
          
          if (!externalCards.some(c => c.id === cardId)) {
            externalCards.push({
              id: cardId,
              title: title,
              ref: ref,
              operator: op,
              price: price,
              image: formatarCaminhoImagem(item.image || item.foto || item.caminho || '', op, ref),
              type: classifyCardType(title)
            });
          }
        });
      }
    }

    try { parseExternal(window.telefonicaData, "Telefônica"); } catch(e){}
    try { parseExternal(window.telebrasData, "Telebrás"); } catch(e){}
    try { parseExternal(window.embratelData, "Embratel"); } catch(e){}
    try { parseExternal(window.brasiltelecomData, "Brasil Telecom"); } catch(e){}
    try { parseExternal(window.crtData, "CRT"); } catch(e){}
    try { parseExternal(window.oiData, "Oi"); } catch(e){}
    try { parseExternal(window.telemarData, "Telemar"); } catch(e){}
    try { parseExternal(window.ceterpData, "Ceterp"); } catch(e){}
    try { parseExternal(window.cbtcData, "CBTC"); } catch(e){}
    try { parseExternal(window.teleparData, "Telepar"); } catch(e){}
    try { parseExternal(window.telescData, "Telesc"); } catch(e){}
    try { parseExternal(window.telemigData, "Telemig"); } catch(e){}
    try { parseExternal(window.telegoiasData, "Telegoias"); } catch(e){}
    try { parseExternal(window.telerjData, "Telerj"); } catch(e){}
    try { parseExternal(window.sercomtelData, "Sercomtel"); } catch(e){}

    externalCards = Object.values(
      externalCards.reduce((acc, card) => {
        acc[card.id] = card;
        return acc;
      }, {})
    );

    let hiddenCards = JSON.parse(localStorage.getItem('tc_hidden_cards')) || [];
    externalCards = externalCards.filter(c => !hiddenCards.includes(c.id));

    let soldCards = JSON.parse(localStorage.getItem('tc_sold_cards')) || [];
    let cart = JSON.parse(localStorage.getItem('tc_cart_items')) || [];
    cart = [...new Set(cart)];

    let localEdits = JSON.parse(localStorage.getItem('tc_card_edits')) || {};
    externalCards.forEach(card => {
      if (localEdits[card.id]) {
        card.operator = localEdits[card.id].operator || card.operator;
        card.price = localEdits[card.id].price !== undefined ? localEdits[card.id].price : card.price;
        card.title = localEdits[card.id].title || card.title;
        card.ref = localEdits[card.id].ref !== undefined ? localEdits[card.id].ref : (card.ref || card.id);
        card.image = formatarCaminhoImagem(localEdits[card.id].image || card.image, card.operator, card.ref);
        card.type = classifyCardType(card.title);
      }
    });

    let customCards = JSON.parse(localStorage.getItem('tc_custom_items')) || [];
    customCards = customCards.filter(c => !hiddenCards.includes(c.id));
    customCards.forEach(c => {
      c.ref = c.ref || c.id;
      c.image = formatarCaminhoImagem(c.image, c.operator, c.ref);
      c.price = (!isNaN(parseFloat(c.price)) && parseFloat(c.price) > 0) ? parseFloat(c.price) : 2.00;
      c.type = classifyCardType(c.title);
    });

    let cards = [...customCards, ...externalCards];
    let selectedOp = 'Todos';
    let selectedType = 'Todos';
    let isAdminMode = false;

    window.onload = () => {
      renderFilters();
      renderCatalog();
      renderSoldList();
      updateCartUI();
      populateOperatorSelect();
      updateMissingPhotoCount();
    };

    function updateMissingPhotoCount() {
      // Considera sem foto se o campo estiver vazio, nulo ou se marcou falha de carregamento prévia
      const count = cards.filter(c => !c.image || c.image.trim() === '' || c.imageHasError).length;
      const badge = document.getElementById('missing-photo-count');
      if (badge) badge.innerText = count;
      const btnSemFoto = document.getElementById('btn-type-SemFoto');
      if (btnSemFoto) {
        if (count > 0) btnSemFoto.classList.remove('hidden');
        else btnSemFoto.classList.add('hidden');
      }
    }

    function filterMissingImages() {
      selectedType = 'SemFoto';
      filterType('SemFoto');
    }

    function setViewMode(mode) {
      isAdminMode = mode === 'admin';
      document.body.classList.toggle('admin-mode', isAdminMode);
      document.getElementById('admin-panel').classList.toggle('hidden', !isAdminMode);
      document.getElementById('cart-btn').style.display = isAdminMode ? 'none' : 'flex';
      
      const btnV = document.getElementById('btn-visitor');
      const btnA = document.getElementById('btn-admin');

      if (isAdminMode) {
        btnA.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all bg-brand-cyan text-black shadow";
        btnV.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
      } else {
        btnV.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all bg-white text-black shadow";
        btnA.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
      }
      renderCatalog();
    }

    function toggleViewModeToggle() {
      setViewMode(isAdminMode ? 'visitor' : 'admin');
    }

    function renderFilters() {
      const container = document.getElementById('operator-filters');
      const wrapper = document.getElementById('operator-container');
      const availableOps = DEFAULT_OPS.filter(op => cards.some(c => c.operator === op));
      
      if (cards.length === 0 || availableOps.length === 0) {
        wrapper.classList.add('hidden');
        return;
      }
      
      wrapper.classList.remove('hidden');
      const ops = ["Todos", ...availableOps];
      
      container.innerHTML = ops.map(op => {
        const isActive = selectedOp === op;
        const btnClass = isActive 
          ? 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-brand-accent text-white shadow-md shadow-brand-accent/25' 
          : 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-brand-card text-slate-400 border border-brand-border hover:text-white';
        return `<button onclick="filterOperator('${op}')" class="${btnClass}">${op}</button>`;
      }).join('');
    }

    function filterOperator(op) {
      selectedOp = op;
      renderFilters();
      renderCatalog();
    }

    function filterType(type) {
      selectedType = type;
      ['Todos', 'Completa', 'Lote', 'Avulso', 'SemFoto'].forEach(t => {
        const btn = document.getElementById(`btn-type-${t}`);
        if(btn) {
          if (t === type) {
            btn.className = (t === 'SemFoto')
              ? 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-amber-600 text-white shadow'
              : 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-brand-accent text-white shadow';
          } else {
            btn.className = (t === 'SemFoto')
              ? 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-amber-600/20 text-amber-300 border border-amber-500/40 hover:bg-amber-600 hover:text-white'
              : 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-brand-card text-slate-400 border border-brand-border hover:text-white';
          }
        }
      });
      renderCatalog();
    }

    function openZoomModal(imageSrc, title) {
      if (!imageSrc) return;
      document.getElementById('zoom-modal-img').src = imageSrc;
      document.getElementById('zoom-modal-title').innerText = title || '';
      document.getElementById('zoom-modal').classList.remove('hidden');
      document.getElementById('zoom-modal').classList.add('flex');
    }

    function closeZoomModal() {
      document.getElementById('zoom-modal').classList.add('hidden');
      document.getElementById('zoom-modal').classList.remove('flex');
    }

    window.handleImageError = function(imgEl, cardId) {
      const card = cards.find(c => c.id === cardId);
      if (card) {
        card.imageHasError = true;
      }
      
      const parent = imgEl.parentElement;
      if (parent) {
        parent.innerHTML = `
          <div class="flex flex-col items-center justify-center text-amber-500/60 space-y-1.5 w-full h-full">
            <i class="fa-solid fa-image text-3xl"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Casinha Sem Foto</span>
          </div>
          <div class="card-logo-center" title="Paz.e.Bem">
            <img src="logo.jpg" alt="Logo" onerror="handleLogoError(this)">
          </div>
          <div class="card-brand-vertical">Jaueras</div>
        `;
      }
      updateMissingPhotoCount();
    };

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      const items = cards.filter(c => {
        const matchOp = (selectedOp === 'Todos' || c.operator === selectedOp);
        let matchType = (selectedType === 'Todos' || c.type === selectedType);
        if (selectedType === 'SemFoto') {
          matchType = (!c.image || c.image.trim() === '' || c.imageHasError);
        }
        return matchOp && matchType;
      });
      
      document.getElementById('total-counter-badge').innerText = `${cards.length} itens`;
      updateMissingPhotoCount();

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-brand-card/40 rounded-2xl border border-dashed border-brand-border">
            <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-600 block"></i>
            <p class="text-slate-400 font-semibold text-sm">Nenhum cartão encontrado nesta seleção.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(c => {
        const isSold = soldCards.includes(c.id);
        const inCart = cart.includes(c.id);
        const hasPhoto = c.image && c.image.trim() !== '' && !c.imageHasError;

        let actionButtonHtml = '';
        if (isAdminMode) {
          actionButtonHtml = `
            <div class="absolute top-3 right-3 flex items-center gap-1.5 z-30 bg-brand-dark/90 p-1.5 rounded-xl border border-brand-border backdrop-blur-md shadow-xl">
              <button onclick="toggleSold('${c.id}')" class="w-8 h-8 ${isSold ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300'} hover:opacity-90 rounded-lg flex items-center justify-center font-bold transition-all" title="Marcar como vendido">
                <i class="fa-solid fa-handshake"></i>
              </button>
              <button onclick="openEditModal('${c.id}')" class="w-8 h-8 bg-brand-cyan hover:bg-cyan-400 text-black rounded-lg flex items-center justify-center font-bold transition-all" title="Editar cartão">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteCard('${c.id}')" class="w-8 h-8 bg-red-600 hover:bg-red-700 text-white rounded-lg flex items-center justify-center font-bold transition-all" title="Excluir cartão">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `;
        } else if (!isSold) {
          actionButtonHtml = `
            <button onclick="toggleCart('${c.id}')" class="w-full py-2 bg-brand-dark/90 hover:bg-brand-accent text-slate-200 hover:text-white border border-brand-border rounded-xl text-xs font-extrabold transition-all flex items-center justify-center gap-1.5 shadow-md mb-2">
              <i class="fa-solid ${inCart ? 'fa-check text-emerald-400' : 'fa-plus text-brand-accent'}"></i>
              <span>${inCart ? 'No Álbum' : '+ Adicionar ao Álbum'}</span>
            </button>
          `;
        }

        return `
          <div class="bg-brand-card border ${!hasPhoto ? 'border-amber-500/40' : 'border-brand-border'} hover:border-brand-accent/50 transition-all rounded-2xl p-4 space-y-3 shadow-lg group relative overflow-hidden flex flex-col justify-between">
            ${actionButtonHtml}

            <!-- Imagem do Cartão -->
            <div class="overflow-hidden rounded-xl bg-brand-dark h-44 border border-brand-border flex items-center justify-center catalog-card-image cursor-pointer group relative">
              ${hasPhoto 
                ? `<img src="${c.image}" data-operator="${c.operator}" class="main-card-img group-hover:scale-105 transition-all duration-300" onclick="openZoomModal('${c.image}', '${c.title.replace(/'/g, "\\'")}')" onerror="window.handleImageError(this, '${c.id}');">`
                : `<div class="flex flex-col items-center justify-center text-amber-500/60 space-y-1.5">
                     <i class="fa-solid fa-image text-3xl"></i>
                     <span class="text-[10px] font-bold uppercase tracking-wider">Casinha Sem Foto</span>
                   </div>`
              }
              
              <!-- Logo no Centro Inferior -->
              <div class="card-logo-center" title="Paz.e.Bem">
                <img src="logo.jpg" alt="Logo" onerror="handleLogoError(this)">
              </div>

              <!-- Carimbo Jaueras na Lateral Direita -->
              <div class="card-brand-vertical">
                Jaueras
              </div>
            </div>
            
            <div class="space-y-0.5 mt-2">
              <h4 class="font-bold text-white text-sm truncate" title="${c.title}">${c.title}</h4>
              ${c.ref ? `<div class="text-[11px] font-bold text-brand-cyan truncate"><i class="fa-solid fa-hashtag text-[9px]"></i> ${c.ref}</div>` : ''}
            </div>

            <div class="flex justify-between items-center text-xs pt-2 border-t border-brand-border/50">
              <span class="text-brand-cyan font-semibold flex items-center gap-1">
                <i class="fa-solid fa-tag text-[10px]"></i> ${c.operator || 'Geral'}
              </span>
              <span class="text-brand-accent font-black text-sm">R$ ${parseFloat(c.price || 0).toFixed(2)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCart(id) {
      if (!cart.includes(id)) {
        cart.push(id);
      } else {
        cart = cart.filter(item => item !== id);
      }
      
      cart = [...new Set(cart)];

      localStorage.setItem('tc_cart_items', JSON.stringify(cart));
      updateCartUI();
      renderCatalog();
    }

    function updateCartUI() {
      document.getElementById('cart-counter').innerText = cart.length;
      const listContainer = document.getElementById('cart-items-list');
      const totalPriceEl = document.getElementById('cart-total-price');
      const itemCountEl = document.getElementById('modal-item-count');
      const cartItems = cards.filter(c => cart.includes(c.id));
      let total = 0;

      if (itemCountEl) {
        itemCountEl.innerText = cartItems.length > 0 ? `(${cartItems.length} ${cartItems.length === 1 ? 'item' : 'itens'})` : '';
      }

      if (cartItems.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs italic">Seu álbum está vazio.</div>`;
        totalPriceEl.innerText = 'R$ 0,00';
        return;
      }

      listContainer.innerHTML = cartItems.map(c => {
        total += parseFloat(c.price || 0);
        return `
          <div class="bg-brand-dark p-3 rounded-xl border border-brand-border flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 overflow-hidden">
              <div class="w-12 h-12 rounded-lg bg-brand-card overflow-hidden flex-shrink-0 flex items-center justify-center border border-brand-border catalog-card-image">
                <img src="${c.image}" class="main-card-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=Sem+Foto';">
              </div>
              <div class="truncate">
                <h5 class="text-white text-xs font-bold truncate">${c.title}</h5>
                <div class="flex items-center gap-2">
                  <p class="text-[10px] text-brand-accent font-semibold">R$ ${parseFloat(c.price || 0).toFixed(2)}</p>
                  ${c.ref ? `<span class="text-[9px] text-brand-cyan font-bold font-mono">[${c.ref}]</span>` : ''}
                </div>
              </div>
            </div>
            <button onclick="toggleCart('${c.id}')" class="text-slate-500 hover:text-red-400 p-2"><i class="fa-solid fa-trash text-xs"></i></button>
          </div>
        `;
      }).join('');

      totalPriceEl.innerText = `R$ ${total.toFixed(2)}`;
    }

    function toggleCartModal(open) {
      const modal = document.getElementById('cart-modal');
      if (open) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
      else { modal.classList.add('hidden'); modal.classList.remove('flex'); }
    }

    function checkoutWhatsApp() {
      const cartItems = cards.filter(c => cart.includes(c.id));
      if (cartItems.length === 0) return;
      let total = 0;
      let text = "Olá! Gostaria de verificar a disponibilidade e consultar os seguintes cartões do acervo TeleCards:\n\n";
      
      cartItems.forEach(c => {
        total += parseFloat(c.price || 0);
        const refText = c.ref ? ` [Ref: ${c.ref}]` : '';
        text += `• ${c.title}${refText} (${c.operator}) - R$ ${parseFloat(c.price || 0).toFixed(2)}\n`;
      });
      
      text += `\n*Total Estimado:* R$ ${total.toFixed(2)}\n\n_Aguardando confirmação de disponibilidade._`;
      window.open(`https://api.whatsapp.com/send?phone=5519991203110&text=${encodeURIComponent(text)}`, '_blank');
    }

    function renderSoldList() {
      const container = document.getElementById('sold-list-container');
      const counter = document.getElementById('sold-counter-badge');
      const soldItems = cards.filter(c => soldCards.includes(c.id));
      counter.innerText = `${soldItems.length} vendidos`;

      if (soldItems.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs italic">Nenhum cartão vendido.</div>`;
        return;
      }

      container.innerHTML = soldItems.map(c => `
        <div class="bg-brand-dark p-3 rounded-xl border border-brand-border flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-12 h-12 rounded-lg bg-brand-card overflow-hidden flex-shrink-0 flex items-center justify-center border border-brand-border catalog-card-image">
              <img src="${c.image}" class="main-card-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=Sem+Foto';">
            </div>
            <div class="truncate">
              <h5 class="text-white text-xs font-bold truncate">${c.title}</h5>
              <p class="text-[10px] text-emerald-400 font-semibold">R$ ${parseFloat(c.price || 0).toFixed(2)} &bull; ${c.operator}</p>
            </div>
          </div>
          <button onclick="toggleSold('${c.id}')" class="px-2.5 py-1.5 bg-brand-card hover:bg-brand-border text-slate-300 text-[10px] font-bold rounded-lg border border-brand-border transition-all flex-shrink-0" title="Restaurar cartão">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      `).join('');
    }

    function toggleSold(id) {
      if (soldCards.includes(id)) {
        soldCards = soldCards.filter(item => item !== id);
      } else {
        soldCards.push(id);
        cart = cart.filter(item => item !== id);
        cart = [...new Set(cart)];
        localStorage.setItem('tc_cart_items', JSON.stringify(cart));
        updateCartUI();
      }
      localStorage.setItem('tc_sold_cards', JSON.stringify(soldCards));
      renderCatalog();
      renderSoldList();
    }

    function populateOperatorSelect() {
      const select = document.getElementById('f-operator');
      const linkerSelect = document.getElementById('linker-operator');
      const optionsHtml = DEFAULT_OPS.map(op => `<option value="${op}">${op}</option>`).join('');
      if (select) select.innerHTML = optionsHtml;
      if (linkerSelect) {
        linkerSelect.innerHTML = optionsHtml;
        linkerSelect.value = "Telegoias";
      }
    }

    function openExportModal() {
      const container = document.getElementById('export-checkboxes-container');
      const activeOps = DEFAULT_OPS.filter(op => cards.some(c => c.operator === op));

      container.innerHTML = activeOps.map(op => {
        const fileKey = op.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
        const fileName = fileKey + '.js';
        const isChecked = (op === 'Telegoias') ? 'checked' : '';

        return `
          <label class="flex items-center gap-3 p-3 bg-brand-dark rounded-xl border border-brand-border cursor-pointer hover:border-indigo-500/50 transition-all">
            <input type="checkbox" value="${op}" ${isChecked} class="w-4 h-4 accent-indigo-500 rounded export-op-chk">
            <span class="font-bold text-white text-sm">${op} (${fileName})</span>
          </label>
        `;
      }).join('');

      document.getElementById('export-modal').classList.remove('hidden');
      document.getElementById('export-modal').classList.add('flex');
    }

    function closeExportModal() {
      document.getElementById('export-modal').classList.add('hidden');
      document.getElementById('export-modal').classList.remove('flex');
    }

    function downloadSelectedJS() {
      const checkboxes = document.querySelectorAll('.export-op-chk:checked');
      
      checkboxes.forEach(chk => {
        const opName = chk.value;
        const fileKey = opName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
        const filename = fileKey + '.js';
        const varName = fileKey + 'Data';

        const filteredCards = cards.filter(c => c.operator.toLowerCase() === opName.toLowerCase());
        
        const exportData = filteredCards.map(c => ({
          id: c.id,
          title: c.title,
          ref: c.ref,
          operator: c.operator,
          price: c.price,
          image: c.imageHasError ? '' : c.image
        }));

        const fileContent = `window.${varName} = ${JSON.stringify(exportData, null, 2)};`;
        
        const blob = new Blob([fileContent], { type: 'application/javascript;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      closeExportModal();
    }

    function openLinkerModal() {
      populateOperatorSelect();
      document.getElementById('card-search-input').value = '';
      document.getElementById('linker-modal').classList.remove('hidden');
      document.getElementById('linker-modal').classList.add('flex');
      loadOperatorCardsForQueue();
    }

    function closeLinkerModal() {
      document.getElementById('linker-modal').classList.add('hidden');
      document.getElementById('linker-modal').classList.remove('flex');
      renderCatalog();
      renderFilters();
    }

    function handleQueueFiles(event) {
      const files = Array.from(event.target.files);
      queueFiles = [];
      
      let loadedCount = 0;
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          queueFiles[index] = {
            name: file.name,
            dataUrl: e.target.result
          };
          loadedCount++;
          if (loadedCount === files.length) {
            currentImageIndex = 0;
            updateFeaturedImage();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function updateFeaturedImage() {
      const previewContainer = document.getElementById('current-image-preview-container');
      const nameEl = document.getElementById('current-image-name');
      const counterEl = document.getElementById('current-image-counter');

      if (queueFiles.length === 0) {
        previewContainer.innerHTML = `<span class="text-slate-500 text-center px-4 italic">Nenhuma foto escolhida.</span>`;
        nameEl.innerText = "";
        counterEl.innerText = "Foto 0 de 0";
        return;
      }

      const img = queueFiles[currentImageIndex];
      previewContainer.innerHTML = `<img src="${img.dataUrl}" class="w-full h-full object-contain">`;
      nameEl.innerText = img.name;
      counterEl.innerText = `Foto ${currentImageIndex + 1} de ${queueFiles.length}`;
    }

    function nextQueueImage() {
      if (queueFiles.length === 0) return;
      currentImageIndex = (currentImageIndex + 1) % queueFiles.length;
      updateFeaturedImage();
    }

    function prevQueueImage() {
      if (queueFiles.length === 0) return;
      currentImageIndex = (currentImageIndex - 1 + queueFiles.length) % queueFiles.length;
      updateFeaturedImage();
    }

    function loadOperatorCardsForQueue() {
      const op = document.getElementById('linker-operator').value;
      const searchQuery = document.getElementById('card-search-input').value.toLowerCase().trim();
      const container = document.getElementById('queue-cards-list');
      const countEl = document.getElementById('pending-cards-count');

      let opCards = cards.filter(c => c.operator === op);

      if (searchQuery) {
        opCards = opCards.filter(c => 
          (c.title && c.title.toLowerCase().includes(searchQuery)) || 
          (c.ref && c.ref.toLowerCase().includes(searchQuery))
        );
      }

      countEl.innerText = `${opCards.length} cartões encontrados`;

      if (opCards.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 italic">Nenhum cartão encontrado com esse termo.</div>`;
        return;
      }

      container.innerHTML = opCards.map(c => {
        const hasPhoto = c.image && c.image.trim() !== '' && !c.imageHasError;
        return `
          <div class="bg-brand-dark p-3.5 rounded-2xl border border-brand-border hover:border-brand-cyan/50 transition-all flex items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 flex-grow overflow-hidden">
              <div class="w-14 h-10 rounded-lg bg-brand-card overflow-hidden flex-shrink-0 flex items-center justify-center border border-brand-border catalog-card-image">
                <img src="${c.image}" class="main-card-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=Sem+Foto';">
              </div>
              
              <div class="flex flex-col flex-grow overflow-hidden">
                <h5 class="text-white text-xs font-bold leading-snug break-words" title="${c.title}">${c.title}</h5>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-[10px] text-brand-cyan font-bold">${c.ref || 'Sem código'}</span>
                  ${hasPhoto ? `<span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-bold">Com Foto (Substituível)</span>` : `<span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-bold">Sem Foto</span>`}
                </div>
              </div>
            </div>
            
            <button onclick="bindCurrentImageToCard('${c.id}')" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-all flex items-center gap-1.5 flex-shrink-0 shadow-md">
              <i class="fa-solid fa-link"></i> ${hasPhoto ? 'Trocar Foto' : 'Vincular Foto'}
            </button>
          </div>
        `;
      }).join('');
    }

    function bindCurrentImageToCard(cardId) {
      if (queueFiles.length === 0) {
        alert('Carregue as fotos da sua pasta primeiro no botão "Escolher Imagens".');
        return;
      }

      const featuredImg = queueFiles[currentImageIndex];
      const op = document.getElementById('linker-operator').value;
      const imageData = featuredImg.dataUrl;

      localEdits[cardId] = { 
        ...(localEdits[cardId] || {}), 
        image: imageData, 
        operator: op 
      };
      localStorage.setItem('tc_card_edits', JSON.stringify(localEdits));

      const card = cards.find(c => c.id === cardId);
      if (card) {
        card.image = imageData;
        card.imageHasError = false; // Restaura ao vincular nova foto
      }

      loadOperatorCardsForQueue();
      nextQueueImage();
    }

    function openModal() {
      populateOperatorSelect();
      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-circle-plus text-brand-accent"></i> Adicionar Novo Cartão`;
      document.getElementById('f-id').value = '';
      document.getElementById('f-title').value = '';
      document.getElementById('f-ref').value = '';
      document.getElementById('f-price').value = '2.00';
      document.getElementById('f-image').value = '';
      document.getElementById('admin-modal').classList.remove('hidden');
      document.getElementById('admin-modal').classList.add('flex');
    }

    function openEditModal(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      populateOperatorSelect();
      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-brand-cyan"></i> Editar Cartão`;
      document.getElementById('f-id').value = card.id;
      document.getElementById('f-title').value = card.title;
      document.getElementById('f-ref').value = card.ref || '';
      document.getElementById('f-operator').value = card.operator || 'Telegoias';
      document.getElementById('f-price').value = card.price || 2.00;
      document.getElementById('f-image').value = card.image.startsWith('data:image') ? '' : card.image;
      document.getElementById('admin-modal').classList.remove('hidden');
      document.getElementById('admin-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('admin-modal').classList.add('hidden');
      document.getElementById('admin-modal').classList.remove('flex');
    }

    function saveCard(event) {
      event.preventDefault();
      const id = document.getElementById('f-id').value;
      const title = document.getElementById('f-title').value;
      const ref = document.getElementById('f-ref').value;
      const operator = document.getElementById('f-operator').value;
      const price = parseFloat(document.getElementById('f-price').value) || 2.00;
      let image = document.getElementById('f-image').value;
      if (!image.startsWith('data:image')) {
        image = formatarCaminhoImagem(image, operator, ref);
      }
      const type = classifyCardType(title);

      if (id) {
        if (externalCards.some(c => c.id === id)) {
          localEdits[id] = { title, ref, operator, price, image };
          localStorage.setItem('tc_card_edits', JSON.stringify(localEdits));
        } else {
          let customCards = JSON.parse(localStorage.getItem('tc_custom_items')) || [];
          let idx = customCards.findIndex(c => c.id === id);
          if (idx !== -1) {
            customCards[idx] = { id, title, ref, operator, price, image, type };
            localStorage.setItem('tc_custom_items', JSON.stringify(customCards));
          }
        }
        
        const cardObj = cards.find(c => c.id === id);
        if (cardObj) {
          cardObj.title = title;
          cardObj.ref = ref;
          cardObj.operator = operator;
          cardObj.price = price;
          cardObj.image = image;
          cardObj.imageHasError = false;
          cardObj.type = type;
        }
      } else {
        const newId = 'custom-' + Date.now();
        const newCard = { id: newId, title, ref, operator, price, image, imageHasError: false, type };
        let customCards = JSON.parse(localStorage.getItem('tc_custom_items')) || [];
        customCards.push(newCard);
        localStorage.setItem('tc_custom_items', JSON.stringify(customCards));
        cards.unshift(newCard);
      }

      closeModal();
      renderCatalog();
      renderFilters();
      renderSoldList();
    }

    function deleteCard(id) {
      if (!confirm('Deseja realmente remover este cartão do catálogo?')) return;
      hiddenCards.push(id);
      localStorage.setItem('tc_hidden_cards', JSON.stringify(hiddenCards));
      cards = cards.filter(c => c.id !== id);
      renderCatalog();
      renderFilters();
      renderSoldList();
    }
  </script>
